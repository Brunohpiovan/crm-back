
# Configuration
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

# Necessário para reconstruir corretamente a URL da requisição (validação de assinatura Twilio) atrás de reverse proxy/load balancer
server.forward-headers-strategy=framework

# Graceful shutdown: da tempo de requisicoes em andamento (e ao MovimentacaoScheduler, que ja
# tem lock proprio para nao duplicar execucao entre instancias) terminarem antes do processo
# encerrar em um deploy, em vez de derrubar tudo na hora.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compressao HTTP: respostas JSON de listagens (dashboard, oportunidades, protocolos) se
# beneficiam bastante de gzip; threshold evita comprimir respostas pequenas (overhead > beneficio).
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024


# Banco de Dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.database-type=${FLYWAY_DB_TYPE:mysql}

# open-in-view=true (default do Spring Boot) mantem a conexao JDBC presa durante toda a
# renderizacao da resposta HTTP, incluindo lazy loading acionado na serializacao Jackson.
# Como os services ja carregam explicitamente o que precisam (JOIN FETCH/@EntityGraph), desligar
# nao deveria mudar nenhum comportamento observavel - so libera a conexao mais cedo.
spring.jpa.open-in-view=false

# Batching de INSERT/UPDATE do Hibernate (ex.: saveAll de reindexacao de oportunidades,
# vinculacao em lote de mensagens ao abrir protocolo).
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP: sem essas propriedades a app rodava 100% no default (pool de 10, sem max-lifetime).
# max-lifetime PRECISA ficar abaixo do wait_timeout do MySQL/proxy gerenciado em producao (ex.:
# Railway) - o valor abaixo (25min) e conservador, mas so quem tem acesso ao painel do banco em
# producao consegue confirmar o wait_timeout real; ajuste via env var se necessario.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

# JWT
api.security.token.secret=${JWT_SECRET}

# IP
geo.api.url=${GEO_API_URL:http://ip-api.com/json/}
api.ip-location.url=${IP_LOCATION_URL:http://ip-api.com/json/}

# Resend (API de envio de e-mail)
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:Faculdade Vincit <no-reply@faculdadevincit.edu.br>}

# AWS
aws.s3.bucket-name=${AWS_BUCKET}
aws.s3.access-key-id=${AWS_ACCESS_KEY}
aws.s3.secret-access-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION}
aws.java.v1.disableDeprecationAnnouncement=${AWS_DISABLE_DEPRECATION:true}

# Upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}

# Twilio
twilio.account.sid=${TWILIO_SID}
twilio.auth.token=${TWILIO_TOKEN}
twilio.whatsapp.number=${TWILIO_NUMBER}

# Frontend / CORS
app.frontend.url=${FRONTEND_URL}
# Rota do front-end que le o token da query string e efetiva a troca de senha (POST
# /reset-password). Extraido em property em vez de hardcoded no service porque essa rota ja
# mudou de nome uma vez entre os front-ends do projeto (Angular -> React) e um link antigo em
# e-mails ja enviados/cache do usuario nao pode virar 404 silencioso de novo.
app.frontend.reset-password-path=${FRONTEND_RESET_PASSWORD_PATH:/redefinir-senha}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url}}

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.packages-to-scan=com.juridiqsystem.crm.controller

# FFmpeg
ffmpeg.path=${FFMPEG_PATH:ffmpeg}
ffmpeg.timeout-seconds=${FFMPEG_TIMEOUT_SECONDS:30}

# Actuator: so health/info/metrics ficam expostos (nunca env/beans/configprops, que podem vazar
# configuracao sensivel). /actuator/health fica liberado no SecurityConfiguration para permitir
# healthcheck da plataforma (Railway) sem JWT; os componentes de detalhe (db, diskspace) ficam
# ocultos por padrao (show-details=never) para nao vazar informacao de infraestrutura num endpoint
# publico - /actuator/metrics continua exigindo autenticacao, coberto pela regra generica
# anyRequest().authenticated() do SecurityConfiguration.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true



