
# Configuration
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

# Necessário para reconstruir corretamente a URL da requisição atrás de reverse proxy/load balancer
server.forward-headers-strategy=framework

# Graceful shutdown: da tempo de requisicoes em andamento (e ao MovimentacaoScheduler, que ja
# tem lock proprio para nao duplicar execucao entre instancias) terminarem antes do processo
# encerrar em um deploy, em vez de derrubar tudo na hora.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compressao HTTP: respostas JSON de listagens (dashboard, oportunidades, protocolos) se
# beneficiam bastante de gzip; threshold evita comprimir respostas pequenas (overhead > beneficio).
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024


# Banco de Dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.database-type=${FLYWAY_DB_TYPE:mysql}

# open-in-view=true (default do Spring Boot) mantem a conexao JDBC presa durante toda a
# renderizacao da resposta HTTP, incluindo lazy loading acionado na serializacao Jackson.
# Como os services ja carregam explicitamente o que precisam (JOIN FETCH/@EntityGraph), desligar
# nao deveria mudar nenhum comportamento observavel - so libera a conexao mais cedo.
spring.jpa.open-in-view=false

# Batching de INSERT/UPDATE do Hibernate (ex.: saveAll de reindexacao de oportunidades,
# vinculacao em lote de mensagens ao abrir protocolo).
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP: sem essas propriedades a app rodava 100% no default (pool de 10, sem max-lifetime).
# max-lifetime PRECISA ficar abaixo do wait_timeout do MySQL/proxy gerenciado em producao (ex.:
# Railway) - o valor abaixo (25min) e conservador, mas so quem tem acesso ao painel do banco em
# producao consegue confirmar o wait_timeout real; ajuste via env var se necessario.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

# JWT
api.security.token.secret=${JWT_SECRET}

# IP
geo.api.url=${GEO_API_URL:http://ip-api.com/json/}
api.ip-location.url=${IP_LOCATION_URL:http://ip-api.com/json/}

# Proxies/load balancers confiáveis (CSV de IP/CIDR, ex.: "10.0.0.0/8"). Só quando o peer TCP
# direto da requisição bate com uma dessas faixas é que X-Forwarded-For/X-Real-IP são usados para
# determinar o IP do cliente (rate limiting, allowlist administrativa, log de auditoria) — ver
# TrustedProxyResolver/ClientInfoService. Vazio por padrão: nenhum header é confiado, sempre usa
# o peer TCP direto (mais seguro, mas se a app estiver atrás de um reverse proxy real esse peer
# será o IP do proxy, não do cliente final — configure aqui a faixa real do proxy de produção).
app.trusted-proxies=${TRUSTED_PROXIES:}

# Allowlist de IP para as rotas administrativas /master/** (CSV de IP/CIDR). Camada adicional de
# defesa, NÃO substitui autenticação/autorização (ROLE_MASTER continua obrigatório) — ver
# AdminRouteGuardFilter. Vazio por padrão: a checagem de IP fica desativada (nenhuma faixa
# confiável foi definida ainda); configure em produção para restringir de fato.
app.admin.ip-allowlist=${ADMIN_IP_ALLOWLIST:}

# Segredo adicional exigido no header X-Admin-Route-Secret para acessar /master/**. Camada extra
# de obscuridade/defesa em profundidade — NÃO substitui autenticação/autorização. Vazio por
# padrão: a checagem fica desativada até ser configurada explicitamente (nunca logar, expor em
# resposta/exception ou no Swagger).
app.admin.route-secret=${ADMIN_ROUTE_SECRET:}

# Resend (API de envio de e-mail)
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:Faculdade Vincit <no-reply@faculdadevincit.edu.br>}

# Dominios externos liberados para URL de imagem enviada direto pelo cliente (avatar/logo/foto de
# grupo, quando NAO é upload de arquivo) - CSV de hostnames, ex.: "cdn.minhaempresa.com". Vazio por
# padrao: nenhum dominio externo extra é aceito (só o asset padrao do front e URLs do proprio
# bucket S3 da aplicacao) - ver ImageUrlValidator.
app.allowed-image-domains=${ALLOWED_IMAGE_DOMAINS:}

# AWS
aws.s3.bucket-name=${AWS_BUCKET}
aws.s3.access-key-id=${AWS_ACCESS_KEY}
aws.s3.secret-access-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION}
aws.java.v1.disableDeprecationAnnouncement=${AWS_DISABLE_DEPRECATION:true}

# Upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}

# Criptografia em repouso de credenciais reversíveis (ex.: WhatsAppIntegration.accessToken) — chave
# AES-256 em base64, nunca hardcoded. Gerar com: openssl rand -base64 32. Reaproveitada para o
# access token da Meta (equivalente a META_TOKEN_ENCRYPTION_KEY) em vez de uma segunda chave
# dedicada: EncryptedStringConverter já é genérico, não específico de nenhum provedor — manter uma
# única chave/mecanismo de criptografia em repouso para todo o projeto evita duplicar segredo e
# rotação. Ver docs/whatsapp/META_SETUP.md.
app.encryption.key=${APP_ENCRYPTION_KEY}

# Meta WhatsApp Cloud API (ver docs/whatsapp/META_SETUP.md para onde obter cada valor)
meta.whatsapp.graph-api-version=${META_GRAPH_API_VERSION:v23.0}
meta.whatsapp.graph-base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
meta.whatsapp.app-id=${META_APP_ID:}
meta.whatsapp.app-secret=${META_APP_SECRET:}
meta.whatsapp.config-id=${META_CONFIG_ID:}
meta.whatsapp.verify-token=${META_VERIFY_TOKEN:}
meta.whatsapp.connect-timeout-ms=${META_CONNECT_TIMEOUT_MS:10000}
meta.whatsapp.read-timeout-ms=${META_READ_TIMEOUT_MS:15000}

# Discord (log de eventos de seguranca): tudo opcional. Vazio = SecurityLogger so grava no log
# local, sem tentar enviar nada (ex.: ambiente local/dev sem webhook configurado).
#
# webhook-url = canal padrao, usado por qualquer SecurityEventType sem entrada especifica abaixo
# (hoje so RESOURCE_ACCESS_DENIED cai nesse fallback, unico evento sem canal dedicado).
# Cada evento abaixo tem seu proprio canal (valores reais ficam no .env, nunca aqui).
security.discord.webhook-url=${DISCORD_SECURITY_WEBHOOK_URL:}
security.discord.webhooks-by-event.LOGIN_SUCCESS=${DISCORD_WEBHOOK_LOGIN_SUCCESS:}
security.discord.webhooks-by-event.LOGIN_FAILED=${DISCORD_WEBHOOK_LOGIN_FAILED:}
security.discord.webhooks-by-event.LOGOUT=${DISCORD_WEBHOOK_LOGOUT:}
security.discord.webhooks-by-event.PASSWORD_CHANGED=${DISCORD_WEBHOOK_PASSWORD_CHANGED:}
security.discord.webhooks-by-event.PASSWORD_RESET_REQUEST=${DISCORD_WEBHOOK_PASSWORD_RESET_REQUEST:}
security.discord.webhooks-by-event.PASSWORD_RESET_SUCCESS=${DISCORD_WEBHOOK_PASSWORD_RESET_SUCCESS:}
security.discord.webhooks-by-event.ACCOUNT_LOCKED=${DISCORD_WEBHOOK_ACCOUNT_LOCKED:}
security.discord.webhooks-by-event.ACCESS_DENIED=${DISCORD_WEBHOOK_ACCESS_DENIED:}
security.discord.webhooks-by-event.UNAUTHORIZED_ACCESS=${DISCORD_WEBHOOK_UNAUTHORIZED_ACCESS:}
security.discord.webhooks-by-event.INVALID_TOKEN=${DISCORD_WEBHOOK_INVALID_TOKEN:}
security.discord.webhooks-by-event.RATE_LIMIT_TRIGGERED=${DISCORD_WEBHOOK_RATE_LIMIT_TRIGGERED:}
security.discord.webhooks-by-event.EXPIRED_TOKEN=${DISCORD_WEBHOOK_EXPIRED_TOKEN:}
security.discord.webhooks-by-event.SUSPICIOUS_REQUEST=${DISCORD_WEBHOOK_SUSPICIOUS_REQUEST:}
security.discord.webhooks-by-event.ADMIN_ACTION=${DISCORD_WEBHOOK_ADMIN_ACTION:}
security.discord.webhooks-by-event.RESOURCE_ACCESS_DENIED=${DISCORD_WEBHOOK_RESOURCE_ACCESS_DENIED:}
security.discord.webhooks-by-event.ADMIN_ROUTE_DENIED=${DISCORD_WEBHOOK_ADMIN_ROUTE_DENIED:}

# Frontend / CORS
app.frontend.url=${FRONTEND_URL}
# Rota do front-end que le o token da query string e efetiva a troca de senha (POST
# /reset-password). Extraido em property em vez de hardcoded no service porque essa rota ja
# mudou de nome uma vez entre os front-ends do projeto (Angular -> React) e um link antigo em
# e-mails ja enviados/cache do usuario nao pode virar 404 silencioso de novo.
app.frontend.reset-password-path=${FRONTEND_RESET_PASSWORD_PATH:/redefinir-senha}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url}}

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.packages-to-scan=com.juridiqsystem.crm.controller
# /swagger-ui e /v3/api-docs sao publicos (permitAll no SecurityConfiguration) para documentar a
# API "normal" sem exigir login antes. As rotas administrativas (/master/**, super-admin
# multi-empresa) sao excluidas explicitamente da doc publica - o path em si nao deveria vazar pra
# quem nao tem o segredo/IP liberado (ver AdminRouteGuardFilter), mesmo que o proprio Swagger
# continue acessivel sem autenticacao.
springdoc.paths-to-exclude=/master/**

# FFmpeg
ffmpeg.path=${FFMPEG_PATH:ffmpeg}
ffmpeg.timeout-seconds=${FFMPEG_TIMEOUT_SECONDS:30}

# Paginacao: sem isso o default do Spring Data (max-page-size=2000) permite que qualquer request
# paginado (usuario, oportunidade, protocolo, etc.) peca size=2000 em endpoints com joins pesados -
# abuso de recursos / DoS logico via parametro do cliente. 1000 ainda cobre o caso legitimo real do
# front (GET /usuario?size=1000, usado para montar a lista de contatos do chat interno e a listagem
# de usuarios "carregar tudo de uma vez" - ver front-crm/src/lib/userApi.ts e internalChatApi.ts),
# mas bloqueia valores absurdos tipo size=999999999.
spring.data.web.pageable.max-page-size=1000
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.one-indexed-parameters=false

# Actuator: so health/info/metrics ficam expostos (nunca env/beans/configprops, que podem vazar
# configuracao sensivel). /actuator/health fica liberado no SecurityConfiguration para permitir
# healthcheck da plataforma (Railway) sem JWT; os componentes de detalhe (db, diskspace) ficam
# ocultos por padrao (show-details=never) para nao vazar informacao de infraestrutura num endpoint
# publico - /actuator/metrics continua exigindo autenticacao, coberto pela regra generica
# anyRequest().authenticated() do SecurityConfiguration.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true



